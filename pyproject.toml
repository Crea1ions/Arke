[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arke"
version = "0.1.0"
description = "Autonomous cognitive agent — minimal, local-first, deterministic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "litellm>=1.40",
    "python-telegram-bot>=21.0",
    "structlog>=24.1",
    "jsonschema>=4.22",
    "sqlite-vec>=0.1.9",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
prometheus = ["opentelemetry-exporter-prometheus>=0.46b0"]

[project.scripts]
arke = "arke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["arke"]
