[shell]
# Strict whitelist v0.2 -- only these commands are permitted.
# To add a command: document the decision in Arke-DECISION.md first.
allowed_commands = [
    # Text / search
    "echo", "cat", "grep", "find", "ls", "head", "tail",
    "wc", "sort", "uniq", "awk", "sed", "cut", "tr", "tee",
    # System info (read-only)
    "uptime", "free", "df", "du", "ps", "uname", "hostname",
    "id", "whoami", "pwd", "stat", "env", "which", "lscpu", "lsblk",
    # Media
    "mogrify", "convert", "ffmpeg",
    # Dev
    "git", "python", "python3",
    # Network (read-only)
    "curl", "wget", "jq",
    # File ops
    "date", "touch", "rm", "mkdir", "cp", "mv"
]

# Set to true to disable the whitelist (dangerous -- dev only)
unsafe_mode = false

[workspace]
# Path of the agent's dedicated writable workspace (used in sandbox mode = "workspace").
path = "~/arke-agent-workspace"

# Additional host directories to mount read-only inside the workspace sandbox.
# The agent will see them at their original host path inside the container.
# Safety: "/" and "~" (home root) are blocked regardless of what is listed here.
#
# Example:
# [[workspace.allowed_dirs]]
# path = "/home/devdipper/projets"
# read_only = true
#
# [[workspace.allowed_dirs]]
# path = "/home/devdipper/docs"
# read_only = true
