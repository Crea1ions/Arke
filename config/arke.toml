# ===========================================================================
# Arke — Configuration système (Themelios)
# ===========================================================================

[memory]
global_path        = "memory/global.db"
project_path       = "memory/project.db"
session_path       = "memory/session.db"
cache_path         = "memory/cache.db"
wal_mode           = true
archive_after_days = 30

[routing]
layers = ["cli", "fs", "sqlite", "script", "api", "mcp", "llm"]

[telegram]
token      = "${TELEGRAM_TOKEN}"
local_only = false

[logging]
format = "json"
level  = "info"

[mcp]
base_url          = "http://localhost:3000/mcp"
timeout_sec       = 5
enabled           = true
max_cache_entries = 1000

[mcp.cache_ttl]
web_search = 24
github     = 168
rss_reader = 2
calculator = 0

[cache]
ttl_hours = 24

[vector]
enabled    = true
model      = "gemini/text-embedding-004"
dimensions = 768

[memory_search_hybrid]
enabled = true
candidate_k = 20
final_n = 5
semantic_timeout_ms = 800
lexical_weight = 0.7
semantic_weight = 0.3
query_cache_enabled = true
query_cache_ttl_sec = 3600

[telemetry]
enabled       = true
otlp_endpoint = ""
prometheus    = false

[sandbox]
enabled      = true
mode         = "workspace"
max_size_mb  = 500
allow_fallback = false  # if true, bwrap runtime failures fall back to unsandboxed execution

# ===========================================================================
# Agent — Identité minimale (le contrat cognitif porte le reste)
# ===========================================================================
[agent]
name    = "Arché"
version = "0.3"
system_prompt = """
Tu es Archè, l'agent d'Arke. Ton contrat cognitif définit ton identité, ton style, et tes invariants.
Le JSON de mode actif définit ton comportement spécialisé pour cette conversation.
arke.toml définit tes limites techniques. Respecte-les sans les questionner.
"""

# ===========================================================================
# Modes — Définition des modes disponibles et leurs permissions
# ===========================================================================
[agent_modes]
default_mode = "ask"

[agent_modes.ask]
description = "Analyse, réflexion, discussion — aucun outil"
tools       = []
writes      = false

[agent_modes.search]
description = "Recherche et lecture uniquement — aucune modification"
tools       = ["sqlite", "memory_fts", "memory_read", "memory_search", "vector_search", "web_search", "rss_reader", "calculator", "mcp"]
writes      = false

[agent_modes.plan]
description = "Structuration, planification — mémoire session autorisée"
tools       = ["sqlite", "memory_fts", "memory_read", "memory_search", "memory_write", "memory_forget", "vector_search"]
writes      = "memory_only"

[agent_modes.agent]
description = "Implémentation, exécution — tous les outils disponibles"
tools       = "unrestricted"
writes      = true
warning     = true

# ===========================================================================
# MCP Servers
# ===========================================================================
[mcp_servers]

[mcp_servers.web_search]
enabled = true
command = ".venv/bin/python"
args    = ["arke/interfaces/mcp_servers/web_search.py", "--stdio"]
timeout = 30

[mcp_servers.calculator]
enabled = true
command = ".venv/bin/python"
args    = ["arke/interfaces/mcp_servers/calculator.py", "--stdio"]
timeout = 10

[mcp_servers.rss_reader]
enabled = true
command = ".venv/bin/python"
args    = ["arke/interfaces/mcp_servers/rss_reader.py", "--stdio"]
timeout = 20

[mcp_servers.github]
enabled = true
command = ".venv/bin/python"
args    = ["arke/interfaces/mcp_servers/github.py", "--stdio"]
timeout = 30

[mcp_servers.freeweb]
enabled = true
command = ".venv/bin/python"
args    = ["arke/interfaces/mcp_servers/freeweb.py", "--stdio"]
timeout = 30

# ===========================================================================
# Cognitive Continuity
# ===========================================================================
[social_orchestrator]
enabled                    = true
observation_mode           = false
min_silence_minutes        = 5
active_hours_start         = 8
active_hours_end           = 23
density_base_minutes       = 120
extraction_min_chars       = 200
first_initiative_min_score = 0.6
normal_initiative_min_score = 0.4
max_ignored_before_dormant = 3

[cognitive_initiative_gate]
enabled                 = true
threshold_density       = 0.5
reactivation_threshold  = 0.65
thread_max_age_days     = 14
auto_calibrate          = true
calibration_min_samples = 30
semantic_anchor         = false
semantic_threshold      = 0.65
divergence_rate         = 0.05
decay_rate              = 0.95

[cognitive_initiative_gate.utility_weights]
reactivation = 0.4
importance   = 0.3
density      = 0.2
relevance    = 0.1

# ===========================================================================
# Workspace & Orchestrator
# ===========================================================================
[workspace]
enabled  = true
# Legacy artifact only: kept for optional WVS/PUW reads, never auto-created.
wcu_root = "arke-workspace/WCU"

[orchestrator]
auto_exec_mode          = "disabled"
auto_exec_suggest_after = 3